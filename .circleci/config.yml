version: 2.1

executors:
  python-executor:
    docker:
      - image: cimg/python:3.10
    working_directory: ~/repo

commands:
  install-deps:
    steps:
      - checkout
      - run:
          name: Instalar dependencias
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install pytest

jobs:
  test:
    executor: python-executor
    parallelism: 2  # Ejecuta pruebas en paralelo (divide archivos)
    steps:
      - checkout
      - run:
          name: Instalar pytest
          command: |
            python -m venv venv
            . venv/bin/activate
            pip install pytest
      - run:
          name: Ejecutar pruebas en paralelo
          command: |
            . venv/bin/activate
            circleci tests split test_cliente.py | xargs pytest

  lint:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Instalar flake8
          command: |
            pip install flake8
      - run:
          name: Revisar estilo de código
          command: flake8 . --exclude=venv

  run-script:
    executor: python-executor
    steps:
      - checkout
      - run:
          name: Ejecutar main.py
          command: |
            python main.py < input.txt  # Simula entrada si la tienes preparada

workflows:
  version: 2
  build_and_test:
    jobs:
      - lint
      - test
      - run-script:
          requires:
            - test

notifications:
  webhooks:
    # Puedes añadir aquí tu webhook de Slack o Discord, por ejemplo
    - url: https://hooks.slack.com/services/TU_WEBHOOK_AQUI
      events:
        - success
        - fail
        - fixed
        - on_hold
